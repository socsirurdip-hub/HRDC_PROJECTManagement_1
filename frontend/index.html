<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/csir-hrdc-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CSIR-HRDC Centralized Training Program Management & Analytics Portal - Government of India" />
    <meta name="keywords" content="CSIR, HRDC, Training, Government, Portal" />
    <meta name="author" content="CSIR-HRDC" />
    <title>CSIR-HRDC Training Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem('hrdc-ui-settings') || '{}');
        if (stored.state) {
          if (stored.state.theme) document.documentElement.setAttribute('data-theme', stored.state.theme);
          if (stored.state.fontSize) document.documentElement.setAttribute('data-font', stored.state.fontSize);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
